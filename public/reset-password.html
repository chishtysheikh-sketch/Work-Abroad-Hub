<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f1420">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WorkAbroad">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Reset password · Work Abroad Hub</title>
<style>
  :root{--ink:#14213d;--ink-2:#3a4663;--muted:#6b7490;--line:#e6e8ef;--bg:#fbfaf7;--card:#fff;--brand:#2563eb;--brand-2:#ff8a3d;--ok:#0f9d8a;--bad:#b91c1c;--field:#fff}
  [data-theme="dark"]{--ink:#e8ecf6;--ink-2:#c2c9dc;--muted:#8d96b0;--line:#2a3350;--bg:#0d1324;--card:#151d33;--field:#0f1629;--ok:#2dd4bf;--bad:#f87171}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans","Noto Sans KR",system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
  .card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 24px;box-shadow:0 1px 2px rgba(20,33,61,.06),0 12px 32px rgba(20,33,61,.10)}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;margin-bottom:20px;color:inherit;text-decoration:none}
  .logo-mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;color:#fff;font-size:16px;transform:rotate(-6deg)}
  h1{font-size:23px;letter-spacing:-.01em;margin-bottom:6px}
  .sub{color:var(--muted);font-size:14px;margin-bottom:20px}
  label{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
  .pw{position:relative}
  input{width:100%;padding:13px 46px 13px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;font-size:16px;background:var(--field);color:var(--ink)}
  input:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:transparent}
  .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:18px;padding:6px 8px;cursor:pointer;border-radius:8px}
  .eye:focus-visible{outline:2px solid var(--brand)}
  ul.rules{list-style:none;margin:12px 0 4px;font-size:13px;color:var(--muted);display:grid;gap:3px}
  ul.rules li::before{content:"○ ";font-weight:700}
  ul.rules li.ok{color:var(--ok)} ul.rules li.ok::before{content:"✓ "}
  .btn{display:block;width:100%;margin-top:20px;border:0;border-radius:12px;padding:14px 18px;font:inherit;font-weight:700;font-size:16px;background:var(--brand);color:#fff;cursor:pointer;text-align:center;text-decoration:none;box-shadow:0 6px 18px rgba(37,99,235,.28)}
  .btn:disabled{opacity:.6;cursor:wait}
  .msg{display:none;margin-top:14px;padding:11px 14px;border-radius:12px;font-size:14px;font-weight:600}
  .msg.show{display:block}
  .msg.bad{background:rgba(185,28,28,.1);color:var(--bad)}
  .msg a{color:inherit;text-decoration:underline}
  .done{text-align:center}
  .done .big{font-size:46px;margin-bottom:6px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main class="card">
  <a class="logo" href="/"><span class="logo-mark">W</span>Work Abroad Hub</a>

  <section id="formBox">
    <h1>Choose a new password</h1>
    <p class="sub">새 비밀번호를 입력해 주세요.</p>
    <form id="resetForm" novalidate>
      <label for="pw1">New password · 새 비밀번호</label>
      <div class="pw"><input id="pw1" type="password" autocomplete="new-password" maxlength="72" required><button type="button" class="eye" data-for="pw1" aria-label="Show password">👁️</button></div>
      <label for="pw2">Confirm password · 비밀번호 확인</label>
      <div class="pw"><input id="pw2" type="password" autocomplete="new-password" maxlength="72" required><button type="button" class="eye" data-for="pw2" aria-label="Show password">👁️</button></div>
      <ul class="rules" aria-live="polite">
        <li data-r="len">8 or more characters · 8자 이상</li>
        <li data-r="letter">A letter · 영문자</li>
        <li data-r="num">A number · 숫자</li>
        <li data-r="same">Both passwords match · 비밀번호 일치</li>
      </ul>
      <button class="btn" id="saveBtn" type="submit">Save new password</button>
      <div class="msg bad" id="err" role="alert"></div>
    </form>
  </section>

  <section id="doneBox" class="done" hidden>
    <div class="big">✅</div>
    <h1>Password changed</h1>
    <p class="sub">You can log in now. · 이제 로그인할 수 있어요.</p>
    <a class="btn" href="/">Go to log in</a>
  </section>
</main>
<script src="reset-password.js?v=1795900000"></script>
</body>
</html>
