<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat test</title>
<style>
body{font-family:system-ui;max-width:560px;margin:20px auto;padding:0 12px}
input,button{font:inherit;padding:8px;margin:3px 0}
#log{border:1px solid #ccc;border-radius:10px;height:320px;overflow:auto;padding:10px;background:#fafafa}
.m{margin:6px 0;padding:7px 11px;border-radius:14px;max-width:75%;background:#e5e7eb;width:fit-content}
.me{margin-left:auto;background:#ec4899;color:#fff}.me a{color:#fff}
.del{opacity:.6;font-style:italic}
small{display:block;font-size:11px;opacity:.75}
#seen{text-align:right;font-size:12px;color:#2563eb;height:16px}
.row{display:flex;gap:6px}.row input{flex:1}
</style></head><body>
<h2>Chat test</h2>
<div class="row"><input id="em" placeholder="email"><input id="pw" type="password" placeholder="password" value="password123"><button id="loginBtn">Log in</button></div>
<p id="who"></p>
<div class="row"><input id="other" placeholder="Other person's user id"><button id="startBtn">Open chat</button></div>
<div id="log"></div><div id="seen"></div>
<div class="row"><input id="txt" placeholder="Type a message..."><button id="sendBtn">Send</button></div>
<script src="/socket.io/socket.io.js"></script>
<script src="/chat-test.js"></script></body></html>
