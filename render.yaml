# Render Blueprint: Render → New → Blueprint → pick this repository → fill in the values it asks for.
# Full steps: docs/DEPLOY.md
services:
  - type: web
    name: work-abroad-hub
    runtime: node
    region: singapore              # closest Render region to Korea
    plan: starter                  # "free" also works, but sleeps after 15 idle minutes (first visit then takes ~1 min)
    branch: main
    autoDeployTrigger: checksPass  # deploy after the GitHub tests pass
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: JWT_SECRET
        generateValue: true        # Render makes a long random secret
      # ---- you fill these in (sync: false = asked for on the first deploy, never stored in git) ----
      - key: MONGODB_URI
        sync: false                # MongoDB Atlas connection string
      - key: APP_URL
        sync: false                # https://work-abroad-hub.onrender.com (or your own domain)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      # ---- optional: leave empty to switch the feature off ----
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false                # Slack / Discord webhook for error alerts
      - key: NTS_API_KEY
        sync: false                # data.go.kr business-status lookup
      - key: SOLAPI_API_KEY
        sync: false                # SMS phone codes
      - key: SOLAPI_API_SECRET
        sync: false
      - key: SMS_FROM
        sync: false
